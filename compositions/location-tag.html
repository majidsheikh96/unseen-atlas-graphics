<!DOCTYPE html>
<!-- TEMPLATE: transparent location tag overlay (tag + whoosh baked; composite over footage in CapCut).
     V3: cinematic weight without the AI-pill look — soft gradient panel,
     gold rule, mask-wipe text reveal. Location split into MAIN / SUB.
     Render per location via --variables '{"location_name":"Socotra, Yemen"}' -->
<html lang="en" data-composition-variables='[
  {"id":"location_name","type":"string","label":"Location name","default":"Socotra, Yemen"}
]'>
<head><meta charset="UTF-8">
<script src="../assets/gsap.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1920px; height:1080px; overflow:hidden; background:transparent; }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:transparent; }
  .clip { position:absolute; inset:0; opacity:0; }
  .tagwrap { inset:auto; left:96px; bottom:100px; z-index:10; }
  .panel { position:absolute; inset:-30px -90px -30px -36px;
      background:linear-gradient(92deg, rgba(3,6,11,.88) 0%, rgba(3,6,11,.52) 55%, rgba(3,6,11,0) 100%);
      border-left:3px solid #e8b64c; box-shadow:0 14px 50px rgba(0,0,0,.45); }
  .rule { position:relative; width:64px; height:3px; background:#e8b64c; margin-bottom:18px;
      transform-origin:left center; box-shadow:0 0 14px rgba(232,182,76,.55); }
  .mask { position:relative; overflow:hidden; }
  .t-main { position:relative; color:#fff; font:600 54px Inter,"Segoe UI",Helvetica,Arial,sans-serif;
      letter-spacing:10px; text-shadow:0 3px 22px rgba(0,0,0,.95); white-space:nowrap; }
  .t-sub { position:relative; color:#9aa6bb; font:500 24px Inter,"Segoe UI",Helvetica,Arial,sans-serif;
      letter-spacing:8px; margin-top:12px; text-shadow:0 2px 14px rgba(0,0,0,.95); white-space:nowrap; }
</style>
</head>
<body>
  <div id="stage" data-composition-id="location-tag" data-width="1920" data-height="1080" data-fps="30">
    <div class="clip tagwrap" id="t-tagwrap" data-start="0" data-duration="4">
      <div class="panel" id="t-panel"></div>
      <div class="rule" id="t-rule"></div>
      <div class="mask"><div class="t-main" id="t-main">SOCOTRA</div></div>
      <div class="t-sub" id="t-sub">YEMEN</div>
    </div>
    <!-- whoosh: clean Pixabay whoosh; media-start skips the 0.1s leading silence -->
    <audio class="clip" id="t-whoosh" data-start="0.22" data-duration="0.8" data-track-index="7"
        src="../assets/audio/clean-whoosh.mp3" data-volume="0.5" data-media-start="0.08"></audio>
  </div>
  <script>
    (function(){
      var gv = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      var name = gv.location_name || "Socotra, Yemen";
      // split "Socotra, Yemen" -> MAIN + SUB; single names stay one line
      var parts = name.split(",");
      document.getElementById("t-main").textContent = parts[0].trim().toUpperCase();
      var sub = document.getElementById("t-sub");
      if (parts.length > 1 && parts[1].trim()) { sub.textContent = parts[1].trim().toUpperCase(); }
      else { sub.style.display = "none"; }
      var tl = gsap.timeline({paused:true});
      tl.set("#t-tagwrap", {opacity:1}, 0);
      // cinematic reveal: panel settles, gold rule draws, text wipes in through a mask
      tl.fromTo("#t-panel", {opacity:0, x:-30}, {opacity:1, x:0, duration:0.5, ease:"power3.out"}, 0.25);
      tl.fromTo("#t-rule", {scaleX:0, opacity:0}, {scaleX:1, opacity:1, duration:0.35, ease:"power3.out"}, 0.4);
      tl.fromTo("#t-main", {xPercent:-104}, {xPercent:0, duration:0.65, ease:"power4.out"}, 0.45);
      tl.fromTo("#t-sub", {y:14, opacity:0}, {y:0, opacity:1, duration:0.5, ease:"power3.out"}, 0.72);
      tl.fromTo("#t-tagwrap", {opacity:1}, {opacity:0, y:-14, duration:0.35, ease:"power1.in", immediateRender:false}, 3.55);
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["location-tag"] = tl;
    })();
  </script>
</body>
</html>
