  <script>
    (function(){
      var gv = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
      document.getElementById("cta-name").textContent = gv.channel_name || "Unseen Atlas";
      var card = document.getElementById("cta-card");
      var btn = document.getElementById("cta-btn");
      var textSub = document.getElementById("btn-subscribe");
      var textSubd = document.getElementById("btn-subscribed");
      var tl = gsap.timeline({paused:true});
      tl.set("#cta-clip", {opacity:1}, 0);
      gsap.set(card, {y:300, opacity:0, xPercent:-50});
      tl.to(card, {y:0, opacity:1, xPercent:-50, duration:0.55, ease:"power3.out"}, 0.15);
      tl.to(btn, {scale:0.92, duration:0.15, ease:"power2.out"}, 1.2);
      tl.to(btn, {scale:1, duration:0.4, ease:"elastic.out(1, 0.4)"}, 1.35);
      tl.to(textSub, {opacity:0, duration:0.08, ease:"none"}, 1.35);
      tl.add(function(){ btn.classList.add("done"); }, 1.38);
      tl.to(textSubd, {opacity:1, duration:0.25, ease:"power1.out"}, 1.42);
      tl.to("#cta-clip", {opacity:0, y:-24, duration:0.45, ease:"power1.in"}, 4.5);
      tl.seek(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["subscribe-cta"] = tl;
    })();
  </script>
