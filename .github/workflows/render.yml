name: Render motion graphics

on:
  push:
    paths:
      - 'compositions/**'
      - 'assets/**'
      - 'render-ci.sh'
      - 'video-config.json'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Render mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - quick

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Render all motion graphics
        env:
          RENDER_MODE: ${{ inputs.mode || 'full' }}
        run: |
          chmod +x render-ci.sh
          ./render-ci.sh

      - name: Upload renders to Google Drive
        env:
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          pip install --quiet google-api-python-client google-auth
          python3 scripts/upload-to-drive.py renders/
